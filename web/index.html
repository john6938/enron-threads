<!DOCTYPE html>
<html>
<head>
  <title>Enron email threads</title>
  <meta charset="UTF-8">
<link rel="stylesheet" type="text/css" href="css/dc.graph.css"/>
  <link rel="stylesheet" type="text/css" href="css/dc.css"/>
  <link rel="stylesheet" type="text/css" href="css/d3-tip/example-styles.css"/>
  <link rel="stylesheet" type="text/css" href="css/enron-threads.css"/>

  <script type="text/javascript" src="js/d3.js"></script>
  <script type="text/javascript" src="js/crossfilter.js"></script>
  <script type="text/javascript" src="js/dc.js"></script>
  <script type="text/javascript" src="js/d3-tip/index.js"></script>

  <script type="text/javascript" src="js/jquery.js"></script>
  <script type="text/javascript" src="js/queue.js"></script>

  <script type="text/javascript" src="js/querystring.js"></script>
  <script type="text/javascript" src="js/dc.graph.tracker.domain.js"></script>

  <script type="text/javascript" src="js/dc.graph.js"></script>
  <script type="text/javascript" src="js/d3v4-force.js"></script>
  <script type="text/javascript" src="js/chart.registry.js"></script>
</head>

<body>

  <div id=container>
    <div id=header>
      <select id=people></select>
      <button id=random>random thread</button>
      <div id=progress></div>
    </div>
    <div id=content>
      <div id=left-panel>
        <div id=threads></div>
        <div id=filter-controls>
          <div class=filter-row>
            <label for=nppl-select>Unique senders per thread</label>
            <select id=nppl-select></select>
          </div>
          <div class=filter-row>
            <label for=minhops-select>Minimum chain length</label>
            <select id=minhops-select></select>
          </div>
        </div>
      </div>
      <div id=view>
        <div id=graph></div>
      </div>
      <div id=email-panel></div>
    </div>
  </div>

  <script type="text/javascript" src="js/pako.min.js"></script>
  <script type="text/javascript" src="js/enron-threads.js"></script>
  <div id=acknowledgment>Updated version by <a href="https://github.com/john6938/enron-threads" target="_blank">John Blake</a> · Original version by <a href="https://github.com/gordonwoodhull/enron-threads" target="_blank">Gordon Woodhull</a></div>
</body>
</html>
